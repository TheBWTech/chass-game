<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for move history */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Chess Piece SVG drop shadows for crisp contrast */
        .piece-svg {
            width: 82%;
            height: 82%;
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.45));
            transition: transform 0.15s ease;
            pointer-events: none;
        }
        .square:hover .piece-svg {
            transform: scale(1.06);
        }
        /* King in check pulse animation */
        @keyframes checkPulse {
            0%, 100% { box-shadow: inset 0 0 14px 4px rgba(239, 68, 68, 0.9); background-color: rgba(239, 68, 68, 0.55); }
            50% { box-shadow: inset 0 0 22px 8px rgba(220, 38, 38, 1); background-color: rgba(220, 38, 38, 0.8); }
        }
        .in-check {
            animation: checkPulse 1.4s infinite;
        }
        /* Board responsive sizing ensuring zero overflow on mobile and desktop */
        .board-container {
            width: min(92vw, 72vh, 620px);
            height: min(92vw, 72vh, 620px);
        }
    </style>
</head>

            bK: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#1e293b"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z" fill="#1e293b"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`
        };

        const UNICODE_PIECES = {
            wP: '♙', wR: '♖', wN: '♘', wB: '♗', wQ: '♕', wK: '♔',
            bP: '♟', bR: '♜', bN: '♞', bB: '♝', bQ: '♛', bK: '♚'
        };

        const PIECE_VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };

        // --- 2. WEB AUDIO SYNTHESIZER (NO EXTERNAL ASSETS) ---
        let soundEnabled = true;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'capture') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(65, now + 0.14);
                    gain.gain.setValueAtTime(0.24, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.14);
                } else if (type === 'check') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.setValueAtTime(660, now + 0.09);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'castle') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.setValueAtTime(330, now + 0.07);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'gameover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554, now + 0.12);
                    osc.frequency.setValueAtTime(659, now + 0.24);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                    osc.start(now);
                    osc.stop(now + 0.55);
                }
            } catch (e) {
                // Ignore Web Audio errors if blocked by browser policy
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-on-icon').classList.toggle('hidden', !soundEnabled);
            document.getElementById('sound-off-icon').classList.toggle('hidden', soundEnabled);
        }

        // --- 3. GAME STATE & INITIALIZATION ---
        let board = [];
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // { r, c }
        let legalMovesForSelected = [];
        let lastMove = null; // { from: {r, c}, to: {r, c} }
        let castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
        let enPassantTarget = null; // { r, c } or null
        let halfMoveClock = 0; // For 50-move rule
        let positionHistory = {}; // For Threefold repetition
        let moveHistory = []; // Array of move records for notation and undo
        let capturedByWhite = []; // Black pieces captured by White
        let capturedByBlack = []; // White pieces captured by Black
        let isFlipped = false;
        let gameMode = 'ai'; // 'ai' or 'pvp'
        let aiDifficulty = 'medium'; // 'easy' or 'medium'
        let isGameOver = false;
        let isAIThinking = false;
        let pendingPromotionMove = null;

        const INITIAL_BOARD = [
            ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
            ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
            ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
        ];

        function resetGame() {
            board = INITIAL_BOARD.map(row => [...row]);
            turn = 'w';
            selectedSquare = null;
            legalMovesForSelected = [];
            lastMove = null;
            castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
            enPassantTarget = null;
            halfMoveClock = 0;
            positionHistory = {};
            moveHistory = [];
            capturedByWhite = [];
            capturedByBlack = [];
            isGameOver = false;
            isAIThinking = false;
            pendingPromotionMove = null;

            recordPositionHash();
            closeGameOverModal();
            document.getElementById('promotion-modal').classList.add('hidden');
            document.getElementById('ai-thinking').classList.add('hidden');
            updatePlayerLabels();
            renderBoard();
            updateSidebar();
            updateStatusBanner("White's Turn to Move", 'emerald');
        }

        // --- 4. CHESS RULES & MOVE GENERATION ENGINE ---

        function inBounds(r, c) {
            return r >= 0 && r < 8 && c >= 0 && c < 8;
        }

        function getPieceColor(piece) {
            return piece ? piece[0] : null;
        }

        function getPieceType(piece) {
            return piece ? piece[1] : null;
        }

        // Generate pseudo-legal moves for a piece at (r, c) on a given board state
        function getPseudoLegalMoves(b, r, c, rights, epTarget) {
            const piece = b[r][c];
            if (!piece) return [];
            const color = piece[0];
            const type = piece[1];
            const enemy = color === 'w' ? 'b' : 'w';
            const moves = [];

            const addMove = (toR, toC, flags = {}) => {
                moves.push({
                    from: { r, c },
                    to: { r: toR, c: toC },
                    piece,
                    captured: b[toR][toC],
                    ...flags
                });
            };

            if (type === 'P') {
                const dir = color === 'w' ? -1 : 1;
                const startRow = color === 'w' ? 6 : 1;
                const promoRow = color === 'w' ? 0 : 7;

                // Forward 1
                if (inBounds(r + dir, c) && !b[r + dir][c]) {
                    addMove(r + dir, c, { isPromotion: (r + dir === promoRow) });
                    // Forward 2 from start
                    if (r === startRow && !b[r + 2 * dir][c]) {
                        addMove(r + 2 * dir, c, { isDoublePawn: true });
                    }
                }

                // Diagonal captures + En Passant
                for (const dc of [-1, 1]) {
                    const nr = r + dir;
                    const nc = c + dc;
                    if (inBounds(nr, nc)) {
                        if (b[nr][nc] && getPieceColor(b[nr][nc]) === enemy) {
                            addMove(nr, nc, { isPromotion: (nr === promoRow) });
                        } else if (epTarget && epTarget.r === nr && epTarget.c === nc) {
                            addMove(nr, nc, {
                                isEnPassant: true,
                                captured: enemy + 'P',
                                epCapturedPos: { r, c: nc }
                            });
                        }
                    }
                }
            } else if (type === 'N') {
                const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                for (const [dr, dc] of jumps) {
                    const nr = r + dr, nc = c + dc;
                    if (inBounds(nr, nc) && getPieceColor(b[nr][nc]) !== color) {
                        addMove(nr, nc);
                    }
                }
            } else if (type === 'B' || type === 'R' || type === 'Q') {
                const dirs = [];
                if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
                if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);

                for (const [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    while (inBounds(nr, nc)) {
                        const target = b[nr][nc];
                        if (!target) {
                            addMove(nr, nc);
                        } else {
                            if (getPieceColor(target) === enemy) addMove(nr, nc);
                            break;
                        }
                        nr += dr;
                        nc += dc;
                    }
                }
            } else if (type === 'K') {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (inBounds(nr, nc) && getPieceColor(b[nr][nc]) !== color) {
                            addMove(nr, nc);
                        }
                    }
                }

                // Castling
                const homeRow = color === 'w' ? 7 : 0;
                if (r === homeRow && c === 4) {
                    // Kingside
                    if (rights[color + 'K'] && !b[homeRow][5] && !b[homeRow][6] && b[homeRow][7] === color + 'R') {
                        if (!isSquareAttacked(b, homeRow, 4, enemy) &&
                            !isSquareAttacked(b, homeRow, 5, enemy) &&
                            !isSquareAttacked(b, homeRow, 6, enemy)) {
                            addMove(homeRow, 6, { isCastle: 'K' });
                        }
                    }
                    // Queenside
                    if (rights[color + 'Q'] && !b[homeRow][3] && !b[homeRow][2] && !b[homeRow][1] && b[homeRow][0] === color + 'R') {
                        if (!isSquareAttacked(b, homeRow, 4, enemy) &&
                            !isSquareAttacked(b, homeRow, 3, enemy) &&
                            !isSquareAttacked(b, homeRow, 2, enemy)) {
                            addMove(homeRow, 2, { isCastle: 'Q' });
                        }
                    }
                }
            }

            return moves;
        }

        // Check if square (r, c) is attacked by `attackerColor`
        function isSquareAttacked(b, r, c, attackerColor) {
            // Pawn attacks
            const pawnDir = attackerColor === 'w' ? 1 : -1;
            for (const dc of [-1, 1]) {
                const pr = r + pawnDir, pc = c + dc;
                if (inBounds(pr, pc) && b[pr][pc] === attackerColor + 'P') return true;
            }

            // Knight attacks
            const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
            for (const [dr, dc] of jumps) {
                const nr = r + dr, nc = c + dc;
                if (inBounds(nr, nc) && b[nr][nc] === attackerColor + 'N') return true;
            }

            // King attacks
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (inBounds(nr, nc) && b[nr][nc] === attackerColor + 'K') return true;
                }
            }

            // Orthogonal (Rook / Queen)
            const ortho = [[-1,0],[1,0],[0,-1],[0,1]];
            for (const [dr, dc] of ortho) {
                let nr = r + dr, nc = c + dc;
                while (inBounds(nr, nc)) {
                    const p = b[nr][nc];
                    if (p) {
                        if (p === attackerColor + 'R' || p === attackerColor + 'Q') return true;
                        break;
                    }
                    nr += dr; nc += dc;
                }
            }

            // Diagonal (Bishop / Queen)
            const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
            for (const [dr, dc] of diag) {
                let nr = r + dr, nc = c + dc;
                while (inBounds(nr, nc)) {
                    const p = b[nr][nc];
                    if (p) {
                        if (p === attackerColor + 'B' || p === attackerColor + 'Q') return true;
                        break;
                    }
                    nr += dr; nc += dc;
                }
            }

            return false;
        }

        function findKing(b, color) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (b[r][c] === color + 'K') return { r, c };
                }
            }
            return null;
        }

        function isInCheck(b, color) {
            const kingPos = findKing(b, color);
            if (!kingPos) return false;
            const enemy = color === 'w' ? 'b' : 'w';
            return isSquareAttacked(b, kingPos.r, kingPos.c, enemy);
        }

        // Simulate move on cloned board
        function applyMoveToBoard(b, move, promoChoice = 'Q') {
            const nextB = b.map(row => [...row]);
            const { from, to, piece } = move;
            const color = piece[0];

            nextB[from.r][from.c] = null;

            if (move.isEnPassant) {
                nextB[move.epCapturedPos.r][move.epCapturedPos.c] = null;
            }

            if (move.isPromotion) {
                nextB[to.r][to.c] = color + promoChoice;
            } else {
                nextB[to.r][to.c] = piece;
            }

            if (move.isCastle) {
                const row = from.r;
                if (move.isCastle === 'K') {
                    nextB[row][5] = nextB[row][7];
                    nextB[row][7] = null;
                } else if (move.isCastle === 'Q') {
                    nextB[row][3] = nextB[row][0];
                    nextB[row][0] = null;
                }
            }

            return nextB;
        }

        // Get strictly legal moves for a piece at (r, c)
        function getLegalMovesForSquare(b, r, c, rights, epTarget) {
            const piece = b[r][c];
            if (!piece) return [];
            const color = piece[0];
            const pseudo = getPseudoLegalMoves(b, r, c, rights, epTarget);
            return pseudo.filter(m => {
                const simulated = applyMoveToBoard(b, m, 'Q');
                return !isInCheck(simulated, color);
            });
        }

        // Get all legal moves for `color`
        function getAllLegalMoves(b, color, rights, epTarget) {
            let allMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (getPieceColor(b[r][c]) === color) {
                        allMoves = allMoves.concat(getLegalMovesForSquare(b, r, c, rights, epTarget));
                    }
                }
            }
            return allMoves;
        }

        // --- 5. MOVE EXECUTION, NOTATION & DRAW DETECTION ---

        function coordsToAlgebraic(r, c) {
            const files = 'abcdefgh';
            return files[c] + (8 - r);
        }

        function buildSanNotation(b, move, promoChoice, isCheckAfter, isMateAfter) {
            if (move.isCastle === 'K') return 'O-O' + (isMateAfter ? '#' : isCheckAfter ? '+' : '');
            if (move.isCastle === 'Q') return 'O-O-O' + (isMateAfter ? '#' : isCheckAfter ? '+' : '');

            const type = move.piece[1];
            const color = move.piece[0];
            const dest = coordsToAlgebraic(move.to.r, move.to.c);
            const isCapture = Boolean(move.captured || move.isEnPassant);

            let san = '';
            if (type === 'P') {
                if (isCapture) {
                    san += 'abcdefgh'[move.from.c] + 'x';
                }
                san += dest;
                if (move.isPromotion) {
                    san += '=' + promoChoice;
                }
            } else {
                san += type;
                // Disambiguation if another identical piece can reach the same square
                const sameTypeMoves = [];
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if ((r !== move.from.r || c !== move.from.c) && b[r][c] === move.piece) {
                            const legal = getLegalMovesForSquare(b, r, c, castlingRights, enPassantTarget);
                            if (legal.some(m => m.to.r === move.to.r && m.to.c === move.to.c)) {
                                sameTypeMoves.push({ r, c });
                            }
                        }
                    }
                }
                if (sameTypeMoves.length > 0) {
                    const sameFile = sameTypeMoves.some(pos => pos.c === move.from.c);
                    const sameRank = sameTypeMoves.some(pos => pos.r === move.from.r);
                    if (!sameFile) {
                        san += 'abcdefgh'[move.from.c];
                    } else if (!sameRank) {
                        san += (8 - move.from.r);
                    } else {
                        san += coordsToAlgebraic(move.from.r, move.from.c);
                    }
                }
                if (isCapture) san += 'x';
                san += dest;
            }

            if (isMateAfter) san += '#';
            else if (isCheckAfter) san += '+';

            return san;
        }

        function recordPositionHash() {
            const hash = JSON.stringify({ board, turn, castlingRights, enPassantTarget });
            positionHistory[hash] = (positionHistory[hash] || 0) + 1;
            return positionHistory[hash];
        }

        function isInsufficientMaterial(b) {
            const pieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (b[r][c]) pieces.push({ piece: b[r][c], r, c });
                }
            }
            if (pieces.length === 2) return true; // K vs K
            if (pieces.length === 3) {
                const minor = pieces.find(p => p.piece[1] === 'N' || p.piece[1] === 'B');
                if (minor) return true; // K+B vs K or K+N vs K
            }
            if (pieces.length === 4) {
                const bishops = pieces.filter(p => p.piece[1] === 'B');
                if (bishops.length === 2 && bishops[0].piece[0] !== bishops[1].piece[0]) {
                    const sameSquareColor = ((bishops[0].r + bishops[0].c) % 2) === ((bishops[1].r + bishops[1].c) % 2);
                    if (sameSquareColor) return true; // K+B vs K+B on same color squares
                }
            }
            return false;
        }

        function executeMove(move, promoChoice = 'Q') {
            // Save snapshot for Undo
            const snapshot = {
                board: board.map(r => [...r]),
                turn,
                lastMove: lastMove ? JSON.parse(JSON.stringify(lastMove)) : null,
                castlingRights: { ...castlingRights },
                enPassantTarget: enPassantTarget ? { ...enPassantTarget } : null,
                halfMoveClock,
                capturedByWhite: [...capturedByWhite],
                capturedByBlack: [...capturedByBlack],
                positionHistory: { ...positionHistory }
            };

            const prevBoard = board.map(r => [...r]);
            const movingColor = move.piece[0];
            const movingType = move.piece[1];
            const opponentColor = movingColor === 'w' ? 'b' : 'w';

            // Update captured pieces
            if (move.captured) {
                if (movingColor === 'w') capturedByWhite.push(move.captured);
                else capturedByBlack.push(move.captured);
            }

            // Apply move to board
            board = applyMoveToBoard(board, move, promoChoice);

            // Update Castling Rights
            if (movingType === 'K') {
                castlingRights[movingColor + 'K'] = false;
                castlingRights[movingColor + 'Q'] = false;
            }
            if (movingType === 'R') {
                if (move.from.r === 7 && move.from.c === 0) castlingRights.wQ = false;
                if (move.from.r === 7 && move.from.c === 7) castlingRights.wK = false;
                if (move.from.r === 0 && move.from.c === 0) castlingRights.bQ = false;
                if (move.from.r === 0 && move.from.c === 7) castlingRights.bK = false;
            }
            // If rook is captured on corner
            if (move.to.r === 7 && move.to.c === 0) castlingRights.wQ = false;
            if (move.to.r === 7 && move.to.c === 7) castlingRights.wK = false;
            if (move.to.r === 0 && move.to.c === 0) castlingRights.bQ = false;
            if (move.to.r === 0 && move.to.c === 7) castlingRights.bK = false;

            // Update En Passant target
            if (move.isDoublePawn) {
                const epRow = (move.from.r + move.to.r) / 2;
                enPassantTarget = { r: epRow, c: move.from.c };
            } else {
                enPassantTarget = null;
            }

            // Update 50-move clock
            if (movingType === 'P' || move.captured) {
                halfMoveClock = 0;
            } else {
                halfMoveClock++;
            }

            lastMove = { from: move.from, to: move.to };
            turn = opponentColor;
            selectedSquare = null;
            legalMovesForSelected = [];

            // Check status of next player
            const opponentInCheck = isInCheck(board, opponentColor);
            const opponentMoves = getAllLegalMoves(board, opponentColor, castlingRights, enPassantTarget);
            const isMate = opponentInCheck && opponentMoves.length === 0;
            const isStalemate = !opponentInCheck && opponentMoves.length === 0;

            const san = buildSanNotation(prevBoard, move, promoChoice, opponentInCheck, isMate);
            moveHistory.push({ san, color: movingColor, snapshot });

            const repCount = recordPositionHash();

            // Sound Effects
            if (isMate || isStalemate || repCount >= 3 || halfMoveClock >= 100 || isInsufficientMaterial(board)) {
                playSound('gameover');
            } else if (opponentInCheck) {
                playSound('check');
            } else if (move.isCastle) {
                playSound('castle');
            } else if (move.captured) {
                playSound('capture');
            } else {
                playSound('move');
            }

            renderBoard();
            updateSidebar();

            // Evaluate End-of-Game Conditions
            if (isMate) {
                const winner = movingColor === 'w' ? 'White' : 'Black';
                endGame('Checkmate!', `${winner} wins by checkmate.`, '🏆');
                return;
            }
            if (isStalemate) {
                endGame('Draw by Stalemate', 'No legal moves remaining.', '🤝');
                return;
            }
            if (isInsufficientMaterial(board)) {
                endGame('Draw', 'Insufficient material to checkmate.', '🤝');
                return;
            }
            if (repCount >= 3) {
                endGame('Draw', 'Threefold repetition detected.', '🤝');
                return;
            }
            if (halfMoveClock >= 100) {
                endGame('Draw', '50-move rule reached.', '🤝');
                return;
            }

            // Update Turn Status
            const turnName = turn === 'w' ? 'White' : 'Black';
            if (opponentInCheck) {
                updateStatusBanner(`${turnName} is in Check!`, 'red');
            } else {
                updateStatusBanner(`${turnName}'s Turn to Move`, 'emerald');
            }

            // Trigger AI Move if applicable
            if (!isGameOver && gameMode === 'ai' && turn === 'b') {
                triggerAIMove();
            }
        }

        function endGame(title, subtitle, icon) {
            isGameOver = true;
            updateStatusBanner(`${title} — ${subtitle}`, 'amber');
            document.getElementById('gameover-icon').textContent = icon;
            document.getElementById('gameover-title').textContent = title;
            document.getElementById('gameover-subtitle').textContent = subtitle;
            setTimeout(() => {
                document.getElementById('gameover-modal').classList.remove('hidden');
            }, 350);
        }

        function closeGameOverModal() {
            document.getElementById('gameover-modal').classList.add('hidden');
        }

        function undoMove() {
            if (moveHistory.length === 0 || isAIThinking) return;
            closeGameOverModal();
            isGameOver = false;

            // In AI mode, undo both AI's move and Player's move if it's currently White's turn
            let stepsToUndo = 1;
            if (gameMode === 'ai' && turn === 'w' && moveHistory.length >= 2) {
                stepsToUndo = 2;
            }

            let targetRecord = null;
            for (let i = 0; i < stepsToUndo; i++) {
                targetRecord = moveHistory.pop();
            }

            if (targetRecord && targetRecord.snapshot) {
                const s = targetRecord.snapshot;
                board = s.board.map(r => [...r]);
                turn = s.turn;
                lastMove = s.lastMove;
                castlingRights = { ...s.castlingRights };
                enPassantTarget = s.enPassantTarget;
                halfMoveClock = s.halfMoveClock;
                capturedByWhite = [...s.capturedByWhite];
                capturedByBlack = [...s.capturedByBlack];
                positionHistory = { ...s.positionHistory };
                selectedSquare = null;
                legalMovesForSelected = [];

                const inChk = isInCheck(board, turn);
                const turnName = turn === 'w' ? 'White' : 'Black';
                updateStatusBanner(inChk ? `${turnName} is in Check!` : `${turnName}'s Turn to Move`, inChk ? 'red' : 'emerald');
                renderBoard();
                updateSidebar();
            }
        }

        // --- 6. AI OPPONENT (MINIMAX + ALPHA-BETA PRUNING + PIECE-SQUARE TABLES) ---

        const PST = {
            P: [
                [ 0,  0,  0,  0,  0,  0,  0,  0],
                [50, 50, 50, 50, 50, 50, 50, 50],
                [10, 10, 20, 30, 30, 20, 10, 10],
                [ 5,  5, 10, 25, 25, 10,  5,  5],
                [ 0,  0,  0, 20, 20,  0,  0,  0],
                [ 5, -5,-10,  0,  0,-10, -5,  5],
                [ 5, 10, 10,-20,-20, 10, 10,  5],
                [ 0,  0,  0,  0,  0,  0,  0,  0]
            ],
            N: [
                [-50,-40,-30,-30,-30,-30,-40,-50],
                [-40,-20,  0,  0,  0,  0,-20,-40],
                [-30,  0, 10, 15, 15, 10,  0,-30],
                [-30,  5, 15, 20, 20, 15,  5,-30],
                [-30,  0, 15, 20, 20, 15,  0,-30],
                [-30,  5, 10, 15, 15, 10,  5,-30],
                [-40,-20,  0,  5,  5,  0,-20,-40],
                [-50,-40,-30,-30,-30,-30,-40,-50]
            ],
            B: [
                [-20,-10,-10,-10,-10,-10,-10,-20],
                [-10,  0,  0,  0,  0,  0,  0,-10],
                [-10,  0,  5, 10, 10,  5,  0,-10],
                [-10,  5,  5, 10, 10,  5,  5,-10],
                [-10,  0, 10, 10, 10, 10,  0,-10],
                [-10, 10, 10, 10, 10, 10, 10,-10],
                [-10,  5,  0,  0,  0,  0,  5,-10],
                [-20,-10,-10,-10,-10,-10,-10,-20]
            ],
            R: [
                [ 0,  0,  0,  0,  0,  0,  0,  0],
                [ 5, 10, 10, 10, 10, 10, 10,  5],
                [-5,  0,  0,  0,  0,  0,  0, -5],
                [-5,  0,  0,  0,  0,  0,  0, -5],
                [-5,  0,  0,  0,  0,  0,  0, -5],
                [-5,  0,  0,  0,  0,  0,  0, -5],
                [-5,  0,  0,  0,  0,  0,  0, -5],
                [ 0,  0,  0,  5,  5,  0,  0,  0]
            ],
            Q: [
                [-20,-10,-10, -5, -5,-10,-10,-20],
                [-10,  0,  0,  0,  0,  0,  0,-10],
                [-10,  0,  5,  5,  5,  5,  0,-10],
                [ -5,  0,  5,  5,  5,  5,  0, -5],
                [  0,  0,  5,  5,  5,  5,  0, -5],
                [-10,  5,  5,  5,  5,  5,  0,-10],
                [-10,  0,  5,  0,  0,  0,  0,-10],
                [-20,-10,-10, -5, -5,-10,-10,-20]
            ],
            K: [
                [-30,-40,-40,-50,-50,-40,-40,-30],
                [-30,-40,-40,-50,-50,-40,-40,-30],
                [-30,-40,-40,-50,-50,-40,-40,-30],
                [-30,-40,-40,-50,-50,-40,-40,-30],
                [-20,-30,-30,-40,-40,-30,-30,-20],
                [-10,-20,-20,-20,-20,-20,-20,-10],
                [ 20, 20,  0,  0,  0,  0, 20, 20],
                [ 20, 30, 10,  0,  0, 10, 30, 20]
            ]
        };

        const EVAL_WEIGHTS = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

        function evaluateBoard(b) {
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = b[r][c];
                    if (!p) continue;
                    const color = p[0];
                    const type = p[1];
                    const tableRow = color === 'w' ? r : 7 - r;
                    const value = EVAL_WEIGHTS[type] + (PST[type] ? PST[type][tableRow][c] : 0);
                    score += (color === 'w' ? value : -value);
                }
            }
            return score;
        }

        function minimax(b, depth, alpha, beta, isMaximizingWhite, rights, epTarget) {
            const color = isMaximizingWhite ? 'w' : 'b';
            const moves = getAllLegalMoves(b, color, rights, epTarget);

            if (moves.length === 0) {
                if (isInCheck(b, color)) {
                    return isMaximizingWhite ? (-99999 - depth) : (99999 + depth);
                }
                return 0; // Stalemate
            }

            if (depth === 0) {
                return evaluateBoard(b);
            }

            // Move ordering: captures first for much faster alpha-beta pruning
            moves.sort((a, bMove) => (bMove.captured ? 10 : 0) - (a.captured ? 10 : 0));

            if (isMaximizingWhite) {
                let maxEval = -Infinity;
                for (const m of moves) {
                    const nextB = applyMoveToBoard(b, m, 'Q');
                    const ev = minimax(nextB, depth - 1, alpha, beta, false, rights, null);
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (const m of moves) {
                    const nextB = applyMoveToBoard(b, m, 'Q');
                    const ev = minimax(nextB, depth - 1, alpha, beta, true, rights, null);
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function triggerAIMove() {
            isAIThinking = true;
            document.getElementById('ai-thinking').classList.remove('hidden');

            setTimeout(() => {
                const legalMoves = getAllLegalMoves(board, 'b', castlingRights, enPassantTarget);
                if (legalMoves.length === 0) {
                    isAIThinking = false;
                    document.getElementById('ai-thinking').classList.add('hidden');
                    return;
                }

                let chosenMove = null;

                if (aiDifficulty === 'easy') {
                    // Easy: 50% best 1-ply move, 50% weighted random (prefers captures slightly)
                    if (Math.random() < 0.5) {
                        chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                    } else {
                        let bestScore = Infinity;
                        for (const m of legalMoves) {
                            const nextB = applyMoveToBoard(board, m, 'Q');
                            const score = evaluateBoard(nextB) + (Math.random() * 40 - 20);
                            if (score < bestScore) {
                                bestScore = score;
                                chosenMove = m;
                            }
                        }
                    }
                } else {
                    // Medium: Depth-3 Minimax with Alpha-Beta pruning (Black minimizes score)
                    let bestScore = Infinity;
                    // Shuffle first to vary equal-value openings
                    legalMoves.sort(() => Math.random() - 0.5);
                    legalMoves.sort((a, bMove) => (bMove.captured ? 10 : 0) - (a.captured ? 10 : 0));

                    for (const m of legalMoves) {
                        const nextB = applyMoveToBoard(board, m, 'Q');
                        const score = minimax(nextB, 2, -Infinity, Infinity, true, castlingRights, null);
                        if (score < bestScore) {
                            bestScore = score;
                            chosenMove = m;
                        }
                    }
                }

                isAIThinking = false;
                document.getElementById('ai-thinking').classList.add('hidden');

                if (chosenMove) {
                    executeMove(chosenMove, 'Q');
                }
            }, 280);
        }

        // --- 7. USER INTERACTION & UI RENDERING ---

        function handleSquareClick(r, c) {
            if (isGameOver || isAIThinking) return;
            if (gameMode === 'ai' && turn === 'b') return;

            // Check if clicked square is a valid destination for currently selected piece
            const targetMove = legalMovesForSelected.find(m => m.to.r === r && m.to.c === c);
            if (targetMove) {
                if (targetMove.isPromotion) {
                    openPromotionModal(targetMove);
                } else {
                    executeMove(targetMove);
                }
                return;
            }

            // Otherwise, select own piece
            const clickedPiece = board[r][c];
            if (clickedPiece && getPieceColor(clickedPiece) === turn) {
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    // Deselect
                    selectedSquare = null;
                    legalMovesForSelected = [];
                } else {
                    selectedSquare = { r, c };
                    legalMovesForSelected = getLegalMovesForSquare(board, r, c, castlingRights, enPassantTarget);
                }
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
            }

            renderBoard();
        }

        function openPromotionModal(move) {
            pendingPromotionMove = move;
            const color = move.piece[0];
            const choicesDiv = document.getElementById('promotion-choices');
            choicesDiv.innerHTML = '';

            ['Q', 'R', 'B', 'N'].forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'aspect-square bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-400 rounded-xl flex items-center justify-center p-2 transition transform hover:scale-105';
                btn.innerHTML = PIECE_SVGS[color + type];
                btn.onclick = () => {
                    document.getElementById('promotion-modal').classList.add('hidden');
                    const m = pendingPromotionMove;
                    pendingPromotionMove = null;
                    executeMove(m, type);
                };
                choicesDiv.appendChild(btn);
            });

            document.getElementById('promotion-modal').classList.remove('hidden');
        }

        function renderBoard() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';

            const whiteKingInCheck = isInCheck(board, 'w') ? findKing(board, 'w') : null;
            const blackKingInCheck = isInCheck(board, 'b') ? findKing(board, 'b') : null;

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

            for (let rowIdx = 0; rowIdx < 8; rowIdx++) {
                for (let colIdx = 0; colIdx < 8; colIdx++) {
                    const r = isFlipped ? 7 - rowIdx : rowIdx;
                    const c = isFlipped ? 7 - colIdx : colIdx;

                    const isLight = (r + c) % 2 === 0;
                    const square = document.createElement('div');

                    // Classic Emerald & Cream High-Contrast Palette
                    let bgClass = isLight ? 'bg-[#ebecd0]' : 'bg-[#739552]';

                    // Highlight Selected Square
                    const isSelected = selectedSquare && selectedSquare.r === r && selectedSquare.c === c;
                    // Highlight Last Move
                    const isLastFrom = lastMove && lastMove.from.r === r && lastMove.from.c === c;
                    const isLastTo = lastMove && lastMove.to.r === r && lastMove.to.c === c;

                    if (isSelected) {
                        bgClass = isLight ? 'bg-[#f5f682]' : 'bg-[#b9ca43]';
                    } else if (isLastFrom || isLastTo) {
                        bgClass = isLight ? 'bg-[#f5f682]/80' : 'bg-[#b9ca43]/85';
                    }

                    // King in check warning
                    const isKingCheckSq = (whiteKingInCheck && whiteKingInCheck.r === r && whiteKingInCheck.c === c) ||
                                          (blackKingInCheck && blackKingInCheck.r === r && blackKingInCheck.c === c);

                    square.className = `square relative flex items-center justify-center cursor-pointer select-none ${bgClass} ${isKingCheckSq ? 'in-check' : ''}`;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinate Labels (Rank on left edge, File on bottom edge)
                    const labelColor = isLight ? 'text-[#739552]' : 'text-[#ebecd0]';
                    if (colIdx === 0) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = `absolute top-0.5 left-1 text-[10px] sm:text-xs font-bold leading-none ${labelColor}`;
                        rankLabel.textContent = 8 - r;
                        square.appendChild(rankLabel);
                    }
                    if (rowIdx === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = `absolute bottom-0.5 right-1 text-[10px] sm:text-xs font-bold leading-none ${labelColor}`;
                        fileLabel.textContent = files[c];
                        square.appendChild(fileLabel);
                    }

                    // Render Piece
                    const piece = board[r][c];
                    if (piece) {
                        const pieceWrapper = document.createElement('div');
                        pieceWrapper.className = 'w-full h-full flex items-center justify-center z-10';
                        pieceWrapper.innerHTML = PIECE_SVGS[piece];
                        square.appendChild(pieceWrapper);
                    }

                    // Valid Move Indicators (Dot for empty square, Ring for capture)
                    const validMove = legalMovesForSelected.find(m => m.to.r === r && m.to.c === c);
                    if (validMove) {
                        const indicator = document.createElement('div');
                        if (validMove.captured || validMove.isEnPassant) {
                            indicator.className = 'absolute inset-1 rounded-full border-4 border-slate-900/35 z-20 pointer-events-none';
                        } else {
                            indicator.className = 'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-slate-900/30 z-20 pointer-events-none';
                        }
                        square.appendChild(indicator);
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateSidebar() {
            // 1. Undo Button State
            document.getElementById('undo-btn').disabled = moveHistory.length === 0;

            // 2. Move History List
            const historyList = document.getElementById('move-history-list');
            document.getElementById('move-count-badge').textContent = `${moveHistory.length} Move${moveHistory.length === 1 ? '' : 's'}`;

            if (moveHistory.length === 0) {
                historyList.innerHTML = `<div class="h-full flex items-center justify-center text-slate-500 text-xs italic font-sans">No moves played yet. White starts!</div>`;
            } else {
                let html = '';
                for (let i = 0; i < moveHistory.length; i += 2) {
                    const moveNum = Math.floor(i / 2) + 1;
                    const whiteMove = moveHistory[i].san;
                    const blackMove = moveHistory[i + 1] ? moveHistory[i + 1].san : '';
                    const isLatestRow = (i + 2 >= moveHistory.length);

                    html += `
                        <div class="grid grid-cols-12 items-center px-2.5 py-1 rounded-lg ${isLatestRow ? 'bg-slate-800/80 text-white' : 'text-slate-300 hover:bg-slate-900'}">
                            <span class="col-span-2 text-slate-500 text-xs">${moveNum}.</span>
                            <span class="col-span-5 font-semibold ${i === moveHistory.length - 1 ? 'text-emerald-400' : ''}">${whiteMove}</span>
                            <span class="col-span-5 font-semibold ${i + 1 === moveHistory.length - 1 ? 'text-emerald-400' : ''}">${blackMove}</span>
                        </div>
                    `;
                }
                historyList.innerHTML = html;
                historyList.scrollTop = historyList.scrollHeight;
            }

            // 3. Captured Pieces & Material Advantage
            const sortOrder = { Q: 1, R: 2, B: 3, N: 4, P: 5 };
            const sortedByWhite = [...capturedByWhite].sort((a, b) => sortOrder[a[1]] - sortOrder[b[1]]);
            const sortedByBlack = [...capturedByBlack].sort((a, b) => sortOrder[a[1]] - sortOrder[b[1]]);

            const whiteScore = sortedByWhite.reduce((sum, p) => sum + PIECE_VALUES[p[1]], 0);
            const blackScore = sortedByBlack.reduce((sum, p) => sum + PIECE_VALUES[p[1]], 0);
            const diff = whiteScore - blackScore;

            const whiteCapturedHTML = sortedByWhite.map(p => `<span class="text-base leading-none text-slate-300">${UNICODE_PIECES[p]}</span>`).join('');
            const blackCapturedHTML = sortedByBlack.map(p => `<span class="text-base leading-none text-slate-300">${UNICODE_PIECES[p]}</span>`).join('');

            const topCapturedEl = document.getElementById('top-captured');
            const bottomCapturedEl = document.getElementById('bottom-captured');
            const topAdvEl = document.getElementById('top-advantage');
            const bottomAdvEl = document.getElementById('bottom-advantage');

            topAdvEl.classList.add('hidden');
            bottomAdvEl.classList.add('hidden');

            if (!isFlipped) {
                // Top is Black, Bottom is White
                topCapturedEl.innerHTML = blackCapturedHTML;
                bottomCapturedEl.innerHTML = whiteCapturedHTML;
                if (diff > 0) {
                    bottomAdvEl.textContent = `+${diff}`;
                    bottomAdvEl.classList.remove('hidden');
                } else if (diff < 0) {
                    topAdvEl.textContent = `+${Math.abs(diff)}`;
                    topAdvEl.classList.remove('hidden');
                }
            } else {
                // Top is White, Bottom is Black
                topCapturedEl.innerHTML = whiteCapturedHTML;
                bottomCapturedEl.innerHTML = blackCapturedHTML;
                if (diff > 0) {
                    topAdvEl.textContent = `+${diff}`;
                    topAdvEl.classList.remove('hidden');
                } else if (diff < 0) {
                    bottomAdvEl.textContent = `+${Math.abs(diff)}`;
                    bottomAdvEl.classList.remove('hidden');
                }
            }

            // 4. Turn Badges
            const topTurnBadge = document.getElementById('top-turn-badge');
            const bottomTurnBadge = document.getElementById('bottom-turn-badge');
            const topColor = isFlipped ? 'w' : 'b';
            const bottomColor = isFlipped ? 'b' : 'w';

            topTurnBadge.classList.toggle('hidden', turn !== topColor || isGameOver);
            bottomTurnBadge.classList.toggle('hidden', turn !== bottomColor || isGameOver);
        }

        function updatePlayerLabels() {
            const topNameEl = document.getElementById('top-player-name');
            const bottomNameEl = document.getElementById('bottom-player-name');
            const topAvatarEl = document.getElementById('top-avatar');
            const bottomAvatarEl = document.getElementById('bottom-avatar');

            const diffLabel = aiDifficulty === 'easy' ? 'Easy' : 'Medium';
            const whiteLabel = gameMode === 'ai' ? 'White (You)' : 'White (Player 1)';
            const blackLabel = gameMode === 'ai' ? `Black (AI - ${diffLabel})` : 'Black (Player 2)';

            if (!isFlipped) {
                topNameEl.textContent = blackLabel;
                topAvatarEl.textContent = '♚';
                topAvatarEl.className = 'w-8 h-8 rounded-lg bg-slate-800 text-slate-200 border border-slate-700 flex items-center justify-center text-base font-bold shadow-inner';

                bottomNameEl.textContent = whiteLabel;
                bottomAvatarEl.textContent = '♔';
                bottomAvatarEl.className = 'w-8 h-8 rounded-lg bg-slate-100 text-slate-900 flex items-center justify-center text-base font-bold shadow-inner';
            } else {
                topNameEl.textContent = whiteLabel;
                topAvatarEl.textContent = '♔';
                topAvatarEl.className = 'w-8 h-8 rounded-lg bg-slate-100 text-slate-900 flex items-center justify-center text-base font-bold shadow-inner';

                bottomNameEl.textContent = blackLabel;
                bottomAvatarEl.textContent = '♚';
                bottomAvatarEl.className = 'w-8 h-8 rounded-lg bg-slate-800 text-slate-200 border border-slate-700 flex items-center justify-center text-base font-bold shadow-inner';
            }
        }

        function updateStatusBanner(text, colorTheme) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            statusText.textContent = text;

            statusDot.className = 'w-2.5 h-2.5 rounded-full ';
            if (colorTheme === 'red') {
                statusDot.className += 'bg-red-500 animate-ping';
            } else if (colorTheme === 'amber') {
                statusDot.className += 'bg-amber-400';
            } else {
                statusDot.className += 'bg-emerald-400 animate-pulse';
            }
        }

        function flipBoard() {
            isFlipped = !isFlipped;
            updatePlayerLabels();
            renderBoard();
            updateSidebar();
        }

        function changeGameMode() {
            gameMode = document.getElementById('game-mode').value;
            const diffWrapper = document.getElementById('difficulty-wrapper');
            diffWrapper.classList.toggle('opacity-40', gameMode === 'pvp');
            diffWrapper.classList.toggle('pointer-events-none', gameMode === 'pvp');
            resetGame();
        }

        function changeDifficulty() {
            aiDifficulty = document.getElementById('ai-difficulty').value;
            updatePlayerLabels();
        }

        // Start game on page load
        window.onload = () => {
            resetGame();
        };
    </script>
